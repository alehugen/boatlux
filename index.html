<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/logo-white.png" />
    <meta name="theme-color" content="#00244f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boatlux · DRE</title>
    <script>
      try {
        const pref = localStorage.getItem('boatlux:theme') || 'light'
        const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <style>
      html {
        color-scheme: light;
        background: #00244f;
      }
      html.dark {
        color-scheme: dark;
      }
      /* Tela de carregamento: o marinho da marca, igual ao cabeçalho, para não piscar ao trocar pelo app. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.75rem;
        background: #00244f;
        transition:
          opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 420ms;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
      }
      #boot img {
        width: 13.5rem;
        height: auto;
        opacity: 0;
        animation: boot-in 600ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards;
      }
      #boot .track {
        position: relative;
        width: 8rem;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: #2a5683;
        opacity: 0;
        animation: boot-in 600ms cubic-bezier(0.22, 1, 0.36, 1) 260ms forwards;
      }
      #boot .track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #12bff9;
        animation: boot-slide 1200ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img,
        #boot .track {
          animation: none;
          opacity: 1;
        }
        #boot .track::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <img src="/brand/logo-white.png" alt="" width="216" height="58" />
      <div class="track" aria-hidden="true"></div>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Carregando a Boatlux</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
